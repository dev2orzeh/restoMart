name: restomart
description: "RestoMart - Your One-Stop Solution for Food and Packaging Essentials"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.0

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_facebook_auth: ^7.2.0
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  get: ^4.7.3
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.18.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  lottie: ^3.3.1
  mailer: ^7.2.0
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/RestoMart_All_Category_Images_430x430/
    - assets/icons/
    - assets/data/
    - assets/fonts/
